# 현재 B 검증 계약의 MVP 예시. 기존 deploy-spec.example.yaml은 확장 초안 원문이다.
app: todo-app
source:
  repo: https://github.com/team/todo-example
  commit: 3f2a9c1 # 참고 메타데이터. 실제 배포 대상 이미지는 A가 별도로 확정한다.
build:
  dockerfile: Dockerfile
  runtime_hint: python3.12
port: 8080 # PORT는 여기서만 C가 주입한다.
healthcheck: /healthz
ingress: public
env:
  - name: SECRET_KEY
    secret: true
    generate: true # 첫 배포에서 한 번 생성한 뒤 재사용. value는 넣지 않는다.
  - name: LOG_LEVEL
    secret: false
    generate: false
    value: INFO
backing_services:
  - type: postgres
    bind_as: DATABASE_URL # 임의 문자열 생성 아님. C가 실제 주소를 주입한다.
workload:
  type: request-driven
  scale_to_zero: true
  max_request_seconds: 10 # 명시 후보. 실측/운영 보장 아님.
  websocket: false
processes:
  web: { instances: 1 }
release:
  migrate: python -m app.migrate # C: 이미지 내부·앱 DB 계정·시간 제한 강제.
profile: dev # MVP 메타데이터. 실행 정책으로 사용하지 않는지 C 확인 필요.
