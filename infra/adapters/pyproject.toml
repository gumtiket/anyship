[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anyship-adapters"
version = "0.1.0"
description = "Deployment adapters: the interface the service calls, a mock, and the real environment adapters"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.5,<3"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["anyship_adapters", "anyship_adapters.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
