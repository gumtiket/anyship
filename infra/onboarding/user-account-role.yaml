AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Cross-account deploy role. Lets the service account's server role assume this
  role (with an External ID) to deploy into this account.

Parameters:
  ServiceRoleArn:
    Type: String
    Description: ARN of the service server's IAM role in the service account.
    AllowedPattern: ^arn:aws:iam::[0-9]{12}:role/[\w+=,.@/-]+$
    ConstraintDescription: Must be an IAM role ARN, e.g. arn:aws:iam::123456789012:role/service-server
  ExternalId:
    Type: String
    Description: Unique per user/environment. Generated by the service and shown in its UI.
    MinLength: 16
    MaxLength: 128
    AllowedPattern: ^[\w+=,.@:/-]+$
  RoleName:
    Type: String
    Default: deploy-service-role
    Description: Name of the role created in this account.

Resources:
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref ServiceRoleArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      # MVP: broad on purpose so deployment is not blocked by missing permissions.
      # TODO: narrow to what the foundation/app Terraform actually uses once the
      # end-to-end flow works (MVP doc, risk table).
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  # 공용 기반 Terraform의 state를 보관하는 버킷. state에는 리소스 ID와 네트워크 구성이 들어
  # 있어 민감하므로, 서비스 계정이 아니라 사용자 계정에 둔다.
  # 스택을 지워도 버킷은 남는다(비어 있지 않으면 삭제가 실패하므로 Retain). 정리 방법은 README 참고.
  # 남은 버킷과 이름이 충돌하지 않도록 스택 ID의 앞 8자리를 이름에 붙인다
  # (anyship-tfstate-<계정ID>-<리전>-<8자>, 최대 52자). 서비스는 이름을 계산하지 않고
  # 스택 출력 StateBucketName에서 읽는다.
  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Join
        - "-"
        - - anyship-tfstate
          - !Ref AWS::AccountId
          - !Ref AWS::Region
          - !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref AWS::StackId]]]]
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # 잘못 덮어쓴 state를 되돌릴 수 있게 한다.
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  StateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub ${StateBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  RoleArn:
    Description: Register this ARN (and the External ID) in the service.
    Value: !GetAtt DeployRole.Arn
  AccountId:
    Value: !Ref AWS::AccountId
  StateBucketName:
    Description: Terraform state bucket. The service reads this output; the name is not derivable.
    Value: !Ref StateBucket
