# Shared reverse proxy for every app on this server. Installed once, on the
# first deploy. Terminates HTTPS and gets certificates from Let's Encrypt.
#
#   ACME_EMAIL      (required) contact address for Let's Encrypt
#   ACME_CA_SERVER  defaults to the STAGING CA (certificates are not trusted by
#                   browsers, but issuance limits are generous). Switch to the
#                   production CA only after staging works, see ../README.md.
services:
  traefik:
    image: traefik:v3.7.14
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}
      - --log.level=INFO
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only, but whoever controls Traefik can still read container
      # metadata. Hardening idea: put a docker-socket-proxy in front.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Issued certificates (acme.json). Must survive container re-creation or
      # certificates are re-requested and Let's Encrypt limits are hit.
      - letsencrypt:/letsencrypt
    networks:
      - traefik
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    pids_limit: 200

volumes:
  letsencrypt:

networks:
  # Created here, joined by every app stack as an external network.
  traefik:
    name: traefik
